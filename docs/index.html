<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THREEJS Testing</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px; color: #fff;
      background: rgba(0, 0, 0, 0.45); padding: 8px 12px; border-radius: 6px;
      font-size: 14px; line-height: 1.5; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "trystero": "https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div id="status">Loading…</div>
    <div>Click to look around · WASD to move · Shift to run · Esc to free mouse</div>
  </div>
  <script type="module">
    // Browsers can reuse a saved copy of this page for up to 10 minutes after an update, so
    // keep it minimal and let the versioned files do the work. version.txt is fetched fresh
    // (never from cache) and its value is added to every game file's URL, so browsers can't
    // reuse old copies of those.
    let v = 'dev-' + Date.now();
    try {
      const res = await fetch('version.txt', { cache: 'no-store' });
      if (res.ok) v = (await res.text()).trim();
    } catch {}
    const tag = `?v=${encodeURIComponent(v)}`;
    let loader = null;
    try {
      loader = await import(`./loader.js${tag}`);
      await import(`./game.js${tag}`);
    } catch (err) {
      console.error(err);
      if (loader) loader.showLoadingError();
      else document.getElementById('status').textContent = 'Failed to load. Refresh the page.';
    }
  </script>
</body>
</html>
